stages:
  - build
  - publish-pages

build:
  stage: build
  tags:
    - docker
  image: gradle:7.3.3-jdk11
  script:
    - gradle jar
    - gradle publish
  artifacts:
    paths:
      - build/libs/*.jar

pages:
  stage: publish-pages
  tags:
    - docker
  image: gradle:7.3.3-jdk11
  script:
    - gradle spotbugsMain
    - cp -r build/reports/spotbugs/main/* public
  artifacts:
    paths:
      - public
    expire_in: 1 week
