//file:noinspection GroovyAssignabilityCheck

plugins {
    id 'java'
    id 'maven-publish'
    id 'org.sonarqube' version '2.7'
    id 'com.github.spotbugs' version '5.0.5'
    id 'checkstyle'
    id 'jacoco'
}

group 'com.timtrense'
version '1.0'

repositories {
    mavenCentral()
}

sourceSets {
    example {
        java {
            compileClasspath += sourceSets.main.compileClasspath
            compileClasspath += sourceSets.main.runtimeClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath
        }
    }
    benchmark {
        java {
            compileClasspath += sourceSets.main.compileClasspath
            compileClasspath += sourceSets.main.runtimeClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    benchmarkImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    benchmarkImplementation group: 'org.thymeleaf', name: 'thymeleaf', version: '3.0.12.RELEASE'
    benchmarkImplementation group: 'org.openjdk.jmh', name: 'jmh-core', version: '1.28'
    benchmarkAnnotationProcessor group: 'org.openjdk.jmh', name: 'jmh-generator-annprocess', version: '1.28'
    spotbugsPlugins group: 'com.h3xstream.findsecbugs', name: 'findsecbugs-plugin', version: '1.11.0'
    spotbugsPlugins group: 'com.mebigfatguy.sb-contrib', name: 'sb-contrib', version: '7.4.7'
    implementation group: 'com.github.spotbugs', name: 'spotbugs-annotations', version: '4.5.3'

    implementation group: 'org.projectlombok', name: 'lombok', version: '1.18.16'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.16'
}

configurations {
    exampleCompile.extendsFrom mainCompile
    exampleRuntime.extendsFrom mainRuntime
}

test {
    useJUnitPlatform()
}

task benchmarkFatJar(type: Jar, dependsOn: testClasses) {
    archiveClassifier.set 'benchmark-fat'
    dependsOn compileJava
    manifest {
        attributes 'Main-Class': 'com.timtrense.template.SpeedTest'
    }
    from {
        sourceSets.test.output
        configurations.testRuntimeClasspath?.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    with jar
}

task sourceJar(type: Jar) {
    archiveClassifier.set 'sources'
    from sourceSets.main.allJava
}

task javadocJar(type: Jar) {
    archiveClassifier.set 'javadoc'
    from javadoc
}

artifacts {
    archives benchmarkFatJar, sourceJar, javadocJar
}

publishing {
    publications {
        library(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "https://gitlab.timtrense.com/api/v4/projects/${System.getenv("CI_PROJECT_ID")}/packages/maven"
            name "GitLab"
            credentials(HttpHeaderCredentials) {
                name = "Job-Token"
                value = System.getenv("CI_JOB_TOKEN")
            }
            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }
}

spotbugs {
    ignoreFailures = true
    reportsDir = file("$buildDir/spotbugs")
    onlyAnalyze = ['com.timtrense.template.*']
}
spotbugsMain {
    reports {
        html {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/main.html")
        }
        xml {
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/main.xml")
        }
    }
}

checkstyleMain {
    reports {
        html {
            required = true
            outputLocation = file("$buildDir/reports/checkstyle/main.html")
        }
        xml {
            required = true
            outputLocation = file("$buildDir/reports/checkstyle/main.xml")
        }
    }
    configFile = 'checkstyleMain.xml' as File
}
checkstyleTest {
    configFile = 'checkstyleNull.xml' as File
}
checkstyleBenchmark {
    configFile = 'checkstyleNull.xml' as File
}
checkstyleExample {
    configFile = 'checkstyleNull.xml' as File
}

jacocoTestReport {
    dependsOn test
    reports {
        html {
            required = true
            outputLocation = file("$buildDir/reports/jacoco")
        }
        xml {
            required = true
            outputLocation = file("$buildDir/reports/jacoco/index.xml")
        }
    }
}

task report {
    dependsOn test, spotbugsMain, jacocoTestReport, checkstyleMain
}
